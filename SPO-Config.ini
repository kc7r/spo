; Sandboxie-Plus Hardened Box snippet - v1.17.9
; Paste this into SandMan > Options > Edit Configuration (it will ask for Admin)
; Then Options > Reload Configuration
; This is the free equivalent of Blue Box + extra hardening (no supporter cert needed)
; What it does: hides your files (no read), blocks writes, drops admin, blocks LAN shares
; For full offline malware test, uncomment the 5 ClosedFilePath internet lines at the bottom

[SPO]
Enabled=y
BlockNetworkFiles=y
RecoverFolder=
AutoRecover=n
BorderColor=#FF0000,ttl
Template=AutoRecoverIgnore
Template=LingerPrograms
Template=BlockPorts
Template=qWave
Template=FileCopy
Template=SkipHook
ConfigLevel=10
UsePrivacyMode=y
DropAdminRights=y
ClosePrintSpooler=y
OpenClipboard=n
CopyLimitKb=8192

; Extra: explicitly deny read/write to sensitive user locations (defense in depth,
; PrivacyMode already hides all drives except C:\Windows and C:\Program Files)
ClosedFilePath=C:\Users\sohan\Documents\
ClosedFilePath=C:\Users\sohan\Desktop\
ClosedFilePath=D:\pc\
ClosedKeyPath=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\
ClosedKeyPath=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run

; Uncomment to make this box fully offline (no internet for any program):
;ClosedFilePath=\Device\RawIp
;ClosedFilePath=\Device\Ip*
;ClosedFilePath=\Device\Tcp*
;ClosedFilePath=\Device\Afd*
;ClosedFilePath=\Device\Udp*

; RED BOX (needs paid supporter certificate, strongest):
; To get Orange/Red Enhanced Isolation, add this line under [SPO] in SandMan:
;UseSecurityMode=y
; That enables: DropAdminRights + RestrictDevices + SysCallLockDown + UseRuleSpecificity
; Without cert it will show SBIE error. Stay on Blue (above) if you are free version.
